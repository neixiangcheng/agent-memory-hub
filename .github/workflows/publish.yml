name: publish

# Manual only: publishing is a human decision. Needs an NPM_TOKEN repository secret
# (an npm automation token with publish rights on the package name).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "npm publish --dry-run (no upload)"
        type: boolean
        default: true

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --dry-run --provenance
          else
            npm publish --provenance
          fi
